:root{

.backup div{display:flex;gap:8px;flex-wrap:wrap}
.backup p{margin:0;color:var(--muted);font-size:13px}
.backup label.btn{display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.logo{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line)}

.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--surface-2)}

.btn.danger{background:var(--warn-bg);color:var(--warn)}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--timer);color:var(--timer-fg);

// ---------- State ----------
const S = {tab:"train", sessions:[], active:null, open:{}, confirm:null, expanded:{}, cloud:"loading", timer:null};
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const daysAgo = iso => { const n=Math.round((new Date(todayISO()+"T12:00:00")-new Date(iso+"T12:00:00"))/864e5); return n===0?"today":n===1?"yesterday":n+" days ago"; };

// ---------- Storage: cloud db, with this-device fallback ----------
let db = null;
const queue = {busy:false, next:null};
async function saveSession(sess){
  LS.set("ironlog.active", sess.status==="active" ? sess : null);
  const i = S.sessions.findIndex(s=>s.id===sess.id);
  if (i>=0) S.sessions[i]=sess; else S.sessions.unshift(sess);
  if (!db){ LS.set("ironlog.sessions", S.sessions.filter(s=>s.status==="done")); return; }
  queue.next = sess;
  if (queue.busy) return;
  queue.busy = true;
  while (queue.next){
    const s = queue.next; queue.next = null;
    try { await db.doc("sessions/"+s.id).set(JSON.parse(JSON.stringify(s))); setStatus("Saved"); }
    catch(e){
      if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); if(!queue.next) queue.next=s; }
      else setStatus(e && e.code==="quota_exceeded" ? "Storage is full — delete old sessions in History." : "Couldn't save to the cloud. It's kept on this phone; it will save on the next change.");
    }
  }
  queue.busy = false;
}
async function deleteSession(id){
  S.sessions = S.sessions.filter(s=>s.id!==id);
  if (db){ try{ await db.doc("sessions/"+id).delete(); }catch(e){ setStatus("Couldn't delete — try again."); } }
  else LS.set("ironlog.sessions", S.sessions);
  render();
}
function setStatus(t){ $("status").textContent = t; }

// ---------- Previous performance ----------
function lastFor(exId, excludeId){
  for (const s of doneSessions()){
    if (s.id===excludeId) continue;
    const e = s.entries && s.entries[exId];
    if (e && e.sets && e.sets.some(x=>x.done)) return {date:s.date, sets:e.sets.filter(x=>x.done)};
  }
  return null;
}
function doneSessions(){ return S.sessions.filter(s=>s.status==="done").sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0)); }
function hintFor(exId, prev){
  const ex = EX[exId];
  if (!prev) return {t:"First time: pick a weight you can do for "+ex.lo+" clean reps. This session sets your baseline.", up:false};
  const reps = prev.sets.map(x=>+x.r||0);
  const top = prev.sets[0] ? prev.sets[0].w : "";
  if (reps.length && reps.every(r=>r>=ex.hi)) return {t:"Last time you hit "+ex.hi+"+ on every set at "+(top||"bodyweight")+(top?" kg":"")+". Add weight today.", up:true};
  return {t:"Beat last time: one more rep on any set at the same weight.", up:false};
}

// ---------- Workout ----------
function startWorkout(dayId){
  const day = DAYS[dayId];
  const sess = {id: todayISO()+"-"+dayId+"-"+Math.random().toString(36).slice(2,7), day:dayId, date:todayISO(), startedAt:Date.now(), finishedAt:null, status:"active", entries:{}};
  for (const [exId, n] of day.ex){
    if (sess.entries[exId]) { sess.entries[exId+"__2"] = {sets:Array.from({length:n},()=>({w:"",r:"",done:false}))}; continue; }
    sess.entries[exId] = {sets:Array.from({length:n},()=>({w:"",r:"",done:false}))};
  }
  S.active = sess; S.tab="train"; S.confirm=null;
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
  saveSession(sess); render(); window.scrollTo(0,0);
}
function entryKeys(sess){ return DAYS[sess.day].ex.map(([id])=>id); }

let saveTimer=null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>saveSession(S.active), 900); }

function toggleSet(exId, i){
  const set = S.active.entries[exId].sets[i];
  const row = document.querySelector(`[data-row="${exId}:${i}"]`);
  if (!set.done){
    const wIn=row.querySelector('[data-f="w"]'), rIn=row.querySelector('[data-f="r"]');
    if (set.w==="" && wIn.placeholder && wIn.placeholder!=="kg") set.w = wIn.placeholder;
    if (set.r==="" && rIn.placeholder && !/^\d+–\d+$/.test(rIn.placeholder)) set.r = rIn.placeholder;
    if (set.r===""){ rIn.focus(); setStatus("Enter your reps, then tick the set."); return; }
    set.done = true;
    startTimer(REST[EX[exId].rest], EX[exId].name);
  } else set.done = false;
  clearTimeout(saveTimer); saveSession(S.active); render();
}
function finishWorkout(){
  const s = S.active;
  for (const k of Object.keys(s.entries)) s.entries[k].sets = s.entries[k].sets.filter(x=>x.done);
  s.status="done"; s.finishedAt=Date.now();
  saveSession(s); S.active=null; LS.del("ironlog.active"); stopTimer(); S.tab="history"; S.expanded={[s.id]:true}; render(); window.scrollTo(0,0);
}
function discardWorkout(){ const id=S.active.id; S.active=null; LS.del("ironlog.active"); stopTimer(); deleteSession(id); }

// ---------- Rest timer ----------
function startTimer(sec, label){ S.timer={end:Date.now()+sec*1000, label}; tick(); }
function stopTimer(){ S.timer=null; $("timer").hidden=true; }
function tick(){
  const el=$("timer");
  if (!S.timer){ el.hidden=true; return; }
  const left=Math.round((S.timer.end-Date.now())/1000);
  el.hidden=false; el.classList.toggle("over", left<=0);
  const a=Math.abs(left);
  $("timer-t").textContent=(left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");
  $("timer-lbl").textContent= left>0 ? "Rest · "+S.timer.label : "Rest done — next set";
}
setInterval(tick,500);
$("timer-plus").onclick=()=>{ if(S.timer){S.timer.end+=15000; tick();} };
$("timer-minus").onclick=()=>{ if(S.timer){S.timer.end-=15000; tick();} };
$("timer-skip").onclick=stopTimer;

// ---------- Rendering ----------
function render(){
  $("tab-train").setAttribute("aria-pressed", S.tab==="train");
  $("tab-history").setAttribute("aria-pressed", S.tab==="history");
  const n = doneSessions().length;
  $("sub").textContent = S.cloud==="loading" ? "Loading your workouts…" : n+" workout"+(n===1?"":"s")+" logged";
  $("view").innerHTML = S.tab==="history" ? historyHTML() : (S.active ? workoutHTML() : homeHTML());
}
function nextInRotation(){
  const last = doneSessions()[0];
  if (!last) return "pushA";
  return ORDER[(ORDER.indexOf(last.day)+1)%ORDER.length];
}
function homeHTML(){
  const dow = new Date().getDay();
  const nextId = nextInRotation(), next = DAYS[nextId];
  const lastDone = id => doneSessions().find(s=>s.day===id);
  let h = "";
  if (S.cloud==="local" && !doneSessions().length) h += `<div class="note" style="background:var(--surface-2);color:var(--muted)">Workouts save on this phone. Back them up from History now and then.</div>`;
  h += `<section class="next" aria-label="Up next">
    <span class="eyebrow">Up next in your rotation</span>
    <h2>${esc(next.name)}</h2>
    <p>${esc(next.focus)} · ${next.ex.length} exercises · about 60–75 min</p>
    <button class="btn primary" data-start="${nextId}">Start ${esc(next.name)}</button>
  </section>`;
  h += `<span class="eyebrow">This week's plan</span><div class="week">` + WEEK.slice(1).concat([WEEK[0]]).map(([d,l])=>{
    const isToday = WEEK[dow][0]===d;
    return `<div class="${isToday?"today":""}"><b>${d}</b>${esc(l)}</div>`; }).join("") + `</div>`;
  h += `<span class="eyebrow">All workouts</span><div class="days" style="margin-top:8px">` + ORDER.map(id=>{
    const d=DAYS[id], ld=lastDone(id);
    return `<button class="day" data-start="${id}"><span class="code">${d.code}</span><span class="info"><b>${esc(d.name)}</b><span>${esc(d.focus)} · ${ld?"last "+daysAgo(ld.date):"not done yet"}</span></span><span aria-hidden="true">›</span></button>`;
  }).join("") + `</div>`;
  return h;
}
function workoutHTML(){
  const s=S.active, day=DAYS[s.day];
  const mins=Math.floor((Date.now()-s.startedAt)/60000);
  let h = `<div class="wo-head"><h2>${esc(day.name)}</h2><span class="elapsed num" id="elapsed">${mins} min</span></div>`;
  const seen = {};
  for (const [exId] of day.ex){
    const key = seen[exId] ? exId+"__2" : exId; seen[exId]=true;
    const ex=EX[exId], e=s.entries[key]; if(!e) continue;
    const prev=lastFor(exId, s.id), hint=hintFor(exId, prev);
    const unitLbl = ex.unit==="bw" ? "kg" : (ex.unit==="+kg" ? "+kg" : "kg");
    const repLbl = ex.secs ? "sec" : (ex.each ? "reps/side" : "reps");
    const doneCount = e.sets.filter(x=>x.done).length;
    h += `<article class="ex" aria-label="${esc(ex.name)}">
      <div class="ex-top"><h3>${esc(ex.name)}</h3><button class="btn small" data-how="${key}" aria-expanded="${!!S.open[key]}">Form tips</button></div>
      <div class="ex-meta"><span class="chip ${ex.rest==="heavy"?"heavy":""}">${e.sets.length} × ${ex.lo}–${ex.hi}${ex.secs?" sec":""}${ex.each?" each":""}</span><span class="chip">Rest ${REST[ex.rest]%60?REST[ex.rest]+" sec":REST[ex.rest]/60+" min"}</span><span class="chip num">${doneCount}/${e.sets.length} done</span></div>
      ${HAMZA[exId.replace("__2","")] ? (h=>`<a class="watch hamza" href="${SKOOL}${h[0]}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span class="w"><b>Hamza's demo · skip to ${esc(h[2])}</b><span>${esc(h[3])} · ${esc(h[1])} lesson on Skool</span></span></a>`)(HAMZA[exId.replace("__2","")]) : ""}
      ${VID[exId.replace("__2","")] ? (v=>`<a class="watch ${HAMZA[exId.replace("__2","")]?"alt":""}" href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span class="w"><b>${esc(v[1])}</b><span>${esc(v[2])} · ${esc(v[3])} · YouTube</span></span></a>`)(VID[exId.replace("__2","")]) : ""}
      ${S.open[key]?`<div class="how"><p>${esc(ex.cue)}</p><a href="${YT(ex.q)}" target="_blank" rel="noopener">More videos on YouTube ↗</a></div>`:""}
      <div class="hint ${hint.up?"up":""}">${esc(hint.t)}</div>
      <div class="sets"><span class="h">Set</span><span class="h">Last time</span><span class="h">${unitLbl}</span><span class="h">${repLbl}</span><span class="h">✓</span>`;
    e.sets.forEach((set,i)=>{
      const p = prev && prev.sets[i];
      const prevTxt = p ? ((p.w!==""&&p.w!=null?p.w+" × ":"")+p.r) : "—";
      const wPh = p && p.w!=="" && p.w!=null ? p.w : "kg";
      const rPh = p ? p.r : ex.lo+"–"+ex.hi;
      h += `<div class="row ${set.done?"done":""}" data-row="${key}:${i}">
        <span class="n">${i+1}</span>
        <span class="prev num">${esc(prevTxt)}</span>
        <input data-ex="${key}" data-i="${i}" data-f="w" id="w-${key}-${i}" inputmode="decimal" placeholder="${esc(wPh)}" value="${esc(set.w)}" aria-label="Set ${i+1} weight">
        <input data-ex="${key}" data-i="${i}" data-f="r" id="r-${key}-${i}" inputmode="numeric" placeholder="${esc(rPh)}" value="${esc(set.r)}" aria-label="Set ${i+1} ${repLbl}">
        <button class="check" data-check="${key}:${i}" aria-label="${set.done?"Undo":"Complete"} set ${i+1}" aria-pressed="${set.done}">✓</button>
      </div>`;
    });
    h += `</div><div class="ex-actions"><button class="btn small" data-add="${key}">+ Add set</button>${e.sets.length>1?`<button class="btn small" data-del="${key}">− Remove last set</button>`:""}</div></article>`;
  }
  if (S.confirm==="discard") h += `<div class="confirm"><b>Discard this workout?</b><span>Nothing from this session will be saved.</span><div><button class="btn danger" data-act="discard-yes">Discard</button><button class="btn" data-act="cancel">Keep training</button></div></div>`;
  h += `<div class="finish-bar"><button class="btn" data-act="discard">Discard</button><button class="btn primary" data-act="finish">Finish workout</button></div>`;
  return h;
}
function backupHTML(){
  return `<section class="backup" aria-label="Backup"><b>Backup</b><p>Your workouts live on this phone. Save a backup file every week or two, and send it to Claude when you want your progress reviewed.</p><div><button class="btn small" data-act="export">Save backup file</button><button class="btn small" data-act="copy">Copy backup</button><label class="btn small" for="restore">Restore from file</label><input type="file" id="restore" accept="application/json,.json" hidden></div><p id="backup-msg"></p></section>`;
}
function historyHTML(){
  const list = doneSessions();
  if (!list.length) return backupHTML() + `<div class="empty">No workouts logged yet.<br>Finish your first session and it shows up here with every set you did.</div>`;
  return backupHTML() + `<div class="hist">` + list.map(s=>{
    const keys=Object.keys(s.entries||{}).filter(k=>s.entries[k].sets.length);
    const sets=keys.reduce((a,k)=>a+s.entries[k].sets.length,0);
    const vol=keys.reduce((a,k)=>a+s.entries[k].sets.reduce((b,x)=>b+(parseFloat(x.w)||0)*(parseFloat(x.r)||0),0),0);
    const dur=s.finishedAt?Math.round((s.finishedAt-s.startedAt)/60000):0;
    const open=S.expanded[s.id];
    let body="";
    if (open){
      body = `<div class="sess-body">` + keys.map(k=>{
        const ex=EX[k.replace("__2","")];
        return `<div class="l"><span>${esc(ex?ex.name:k)}</span><span class="num">${esc(s.entries[k].sets.map(x=>(x.w!==""?x.w+"×":"")+x.r).join(", "))}</span></div>`;
      }).join("") + (S.confirm==="del:"+s.id
        ? `<div class="confirm"><b>Delete this workout?</b><span>This can't be undone.</span><div><button class="btn danger" data-delsess="${s.id}">Delete</button><button class="btn" data-act="cancel">Keep it</button></div></div>`
        : `<div><button class="btn small danger" data-askdel="${s.id}">Delete workout</button></div>`) + `</div>`;
    }
    return `<div class="sess"><button class="sess-top" data-expand="${s.id}" aria-expanded="${!!open}"><span class="code" style="font-family:var(--display);font-weight:800;font-size:20px;width:40px">${DAYS[s.day]?DAYS[s.day].code:"?"}</span><span class="info"><b>${esc(DAYS[s.day]?DAYS[s.day].name:s.day)} · ${esc(fmtDate(s.date))}</b><span class="num">${sets} sets · ${Math.round(vol).toLocaleString()} kg moved · ${dur} min</span></span><span aria-hidden="true">${open?"▾":"▸"}</span></button>${body}</div>`;
  }).join("") + `</div>`;
}

// ---------- Events ----------
document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if (t.id==="tab-train"){ S.tab="train"; S.confirm=null; render(); return; }
  if (t.id==="tab-history"){ S.tab="history"; S.confirm=null; render(); return; }
  if (d.start){ if(S.active){ S.tab="train"; render(); return; } startWorkout(d.start); return; }
  if (d.how){ S.open[d.how]=!S.open[d.how]; render(); return; }
  if (d.check){ const [k,i]=d.check.split(":"); toggleSet(k,+i); return; }
  if (d.add){ const sets=S.active.entries[d.add].sets; const last=sets[sets.length-1]||{}; sets.push({w:"",r:"",done:false}); saveSession(S.active); render(); return; }
  if (d.del){ const sets=S.active.entries[d.del].sets; if(sets.length>1) sets.pop(); saveSession(S.active); render(); return; }
  if (d.act==="export"){ exportBackup(); return; }
  if (d.act==="copy"){ const txt=backupText(); navigator.clipboard.writeText(txt).then(()=>backupMsg("Backup copied. Paste it into a note or a message to Claude.")).catch(()=>backupMsg("Couldn't copy. Use Save backup file instead.")); return; }
  if (d.act==="finish"){ finishWorkout(); return; }
  if (d.act==="discard"){ S.confirm="discard"; render(); return; }
  if (d.act==="discard-yes"){ S.confirm=null; discardWorkout(); return; }
  if (d.act==="cancel"){ S.confirm=null; render(); return; }
  if (d.expand){ S.expanded[d.expand]=!S.expanded[d.expand]; S.confirm=null; render(); return; }
  if (d.askdel){ S.confirm="del:"+d.askdel; render(); return; }
  if (d.delsess){ S.confirm=null; deleteSession(d.delsess); return; }
});
document.addEventListener("input", ev=>{
  const el=ev.target; if(!el.dataset || !el.dataset.ex || !S.active) return;
  const set=S.active.entries[el.dataset.ex].sets[+el.dataset.i];
  set[el.dataset.f]=el.value.replace(",",".").trim();
  saveSoon();
});
setInterval(()=>{ const e=$("elapsed"); if(e&&S.active) e.textContent=Math.floor((Date.now()-S.active.startedAt)/60000)+" min"; }, 15000);

// ---------- Backup ----------
function backupText(){ return JSON.stringify({app:"handsome", version:1, exportedAt:new Date().toISOString(), sessions:doneSessions()}, null, 1); }
function backupMsg(t){ const e=document.getElementById("backup-msg"); if(e) e.textContent=t; }
function exportBackup(){
  const blob=new Blob([backupText()],{type:"application/json"});
  const name="handsome-backup-"+todayISO()+".json";
  const file = (typeof File==="function") ? new File([blob], name, {type:"application/json"}) : null;
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:"Handsome backup"}).then(()=>backupMsg("Backup saved.")).catch(()=>{});
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  backupMsg("Backup file saved.");
}
document.addEventListener("change", ev=>{
  if (ev.target.id!=="restore" || !ev.target.files[0]) return;
  ev.target.files[0].text().then(t=>{
    const data=JSON.parse(t); const list=Array.isArray(data)?data:data.sessions;
    if(!Array.isArray(list)) throw new Error("bad");
    let added=0;
    for (const x of list){ if(x && x.id && x.status==="done" && !S.sessions.find(s=>s.id===x.id)){ S.sessions.push(x); added++; } }
    LS.set("ironlog.sessions", S.sessions.filter(s=>s.status==="done"));
    render(); backupMsg(added+" workout"+(added===1?"":"s")+" restored.");
  }).catch(()=>backupMsg("That file isn't a Handsome backup. Pick a file saved with Save backup file."));
});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// ---------- Boot ----------
S.active = LS.get("ironlog.active");
render();
(async ()=>{
  db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db){
    S.cloud="local"; S.sessions = LS.get("ironlog.sessions") || [];
    if (S.active && !S.sessions.find(s=>s.id===S.active.id)) S.sessions.unshift(S.active);
    render(); return;
  }
  const slow = setTimeout(()=>setStatus("Can't reach your saved workouts yet. Logging still works; it will sync when the connection is back."), 10000);
  db.collection("sessions").orderBy("startedAt","desc").limit(300).onSnapshot(snap=>{
    if (!snap.metadata.fromCache){ clearTimeout(slow); setStatus(""); }
    const cloud = snap.docs.map(d=>d.data());
    S.cloud="cloud";
    // keep the in-progress workout from this phone if it's newer than the cloud copy
    if (S.active){
      const c = cloud.find(x=>x.id===S.active.id);
      if (c && c.status==="done") S.active=null;
    } else {
      const c = cloud.find(x=>x.status==="active");
      if (c) S.active = JSON.parse(JSON.stringify(c));
    }
    S.sessions = cloud.map(x=>S.active && x.id===S.active.id ? S.active : x);
    if (S.active && !S.sessions.find(x=>x.id===S.active.id)) S.sessions.unshift(S.active);
    // don't wipe what you're typing: only re-render when you're not mid-edit
    const typing = document.activeElement && document.activeElement.tagName==="INPUT";
    if (!typing) render();
  }, err=>{ clearTimeout(slow); setStatus("Lost the connection to your saved workouts. Reopen the app to reconnect."); });
})();
</script>
